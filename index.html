<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Cuadrante Policía Local Vejer
    </title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="manifest"
        href="manifest.json"
    >

    <meta
        name="theme-color"
        content="#0A2342"
    >

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

    <style>

        #modalAgente {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        #modalAgente .modal-panel {
            transform: scale(0.95);
            opacity: 0;
            transition:
                transform 0.25s ease,
                opacity 0.25s ease;
        }

        #modalAgente.is-open .modal-panel {
            transform: scale(1);
            opacity: 1;
        }

        #modalAgente .modal-button {
            min-height: 52px;
            border-radius: 999px;
            font-size: 1rem;
        }

    </style>

</head>


<body>


<!-- ============================================================
     LOGIN
============================================================ -->

<div
    id="loginScreen"
    class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/90 p-6"
>

    <div
        class="w-full max-w-md rounded-3xl bg-white p-8 shadow-2xl"
    >

        <div class="text-center">

            <img
                src="img/icono-192.png"
                alt="Escudo Policía Local Vejer"
                class="mx-auto mb-6 w-32"
            >

            <div class="cabecera-titulo">

                <h1
                    class="text-4xl md:text-6xl font-extrabold text-[#0A2342] leading-tight"
                >
                    CUADRANTE
                </h1>

                <h2
                    class="text-2xl md:text-4xl font-bold text-[#123C73] leading-tight"
                >
                    POLICÍA LOCAL VEJER 2026
                </h2>

            </div>

        </div>


        <div class="mt-8">

            <input
                id="loginPassword"
                type="password"
                class="w-full border rounded p-3"
                placeholder="Introduzca su contraseña"
                autocomplete="current-password"
                onkeydown="if(event.key==='Enter'){validarAcceso();}"
            >

        </div>


        <button
            type="button"
            onclick="validarAcceso()"
            class="mt-6 w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 rounded"
        >
            Acceder
        </button>


        <p
            id="loginError"
            class="mt-4 text-sm text-red-600 min-h-[1.25rem]"
        ></p>


        <div class="mt-10 text-center">

            <p
                class="text-xs text-slate-500 tracking-[4px]"
            >
                CREADO POR DAVID LECHUGA
            </p>

        </div>

    </div>

</div>



<!-- ============================================================
     APLICACIÓN
============================================================ -->

<div
    id="appContent"
    class="max-w-7xl mx-auto p-6 hidden"
>

    <div
        class="bg-white/95 rounded-3xl shadow-2xl p-8"
    >


        <!-- ====================================================
             CABECERA
        ===================================================== -->

        <div class="relative text-center">

            <!-- AJUSTES DISCRETO -->
            <button
                id="btnAjustes"
                type="button"
                onclick="mostrarMenuAjustes()"
                aria-label="Abrir ajustes"
                title="Ajustes"
                class="absolute right-0 top-0 w-10 h-10 rounded-full
                       text-slate-400 hover:text-[#0A2342]
                       hover:bg-slate-100
                       flex items-center justify-center
                       text-xl transition"
            >
                ⚙️
            </button>

            <img
                src="img/icono-192.png"
                alt="Escudo Policía Local Vejer"
                class="mx-auto h-40 mb-4"
            >

            <div class="cabecera-titulo">

                <h1
                    class="text-4xl md:text-6xl font-extrabold text-[#0A2342] leading-tight"
                >
                    CUADRANTE
                </h1>

                <h2
                    class="text-2xl md:text-4xl font-bold text-[#123C73] leading-tight"
                >
                    POLICÍA LOCAL VEJER
                </h2>

            </div>

        </div>


        <!-- DAMERO -->

        <div
            class="damero mt-6 mb-4"
        ></div>


        <!-- ÚLTIMA ACTUALIZACIÓN -->

        <div
            id="ultimaActualizacion"
            class="text-center text-sm text-slate-600 mb-6 font-semibold"
        ></div>



        <!-- ====================================================
             CONTROLES
        ===================================================== -->

        <div
            class="grid md:grid-cols-2 gap-4"
        >

            <div>

                <label
                    class="font-bold block mb-2"
                >
                    Día
                </label>

                <select
                    id="dia"
                    class="w-full border rounded p-3"
                ></select>

            </div>


            <div>

                <label
                    class="font-bold block mb-2"
                >
                    Mes
                </label>

                <select
                    id="mes"
                    class="w-full border rounded p-3"
                >

                    <option value="1">
                        Enero
                    </option>

                    <option value="2">
                        Febrero
                    </option>

                    <option value="3">
                        Marzo
                    </option>

                    <option value="4">
                        Abril
                    </option>

                    <option value="5">
                        Mayo
                    </option>

                    <option value="6">
                        Junio
                    </option>

                    <option value="7">
                        Julio
                    </option>

                    <option value="8">
                        Agosto
                    </option>

                    <option value="9">
                        Septiembre
                    </option>

                    <option value="10">
                        Octubre
                    </option>

                    <option value="11">
                        Noviembre
                    </option>

                    <option value="12">
                        Diciembre
                    </option>

                </select>

            </div>

        </div>



        <!-- ====================================================
             BOTONES
        ===================================================== -->

        <div
            class="grid md:grid-cols-3 gap-4 mt-6"
        >

            <button
                type="button"
                onclick="buscarTurnos()"
                class="bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 rounded"
            >
                Buscar Turnos
            </button>


            <button
                type="button"
                onclick="irAHoy()"
                class="bg-green-700 hover:bg-green-800 text-white font-bold py-3 rounded"
            >
                Hoy
            </button>


            <button
                id="btnDiaSiguiente"
                type="button"
                onclick="diaSiguiente()"
                class="bg-[#0A2342] hover:bg-[#123C73] text-white font-bold py-3 rounded"
            >
                Día siguiente
            </button>

        </div>



        <!-- ====================================================
             RESULTADOS
        ===================================================== -->

        <div
            id="resultado"
            class="mt-8"
        ></div>



        <!-- ====================================================
             PIE
        ===================================================== -->

        <div
            class="mt-12 text-center"
        >

            <div
                class="h-px bg-slate-300 mb-4"
            ></div>

            <p
                class="text-xs text-slate-500 tracking-[4px]"
            >
                CREADO POR DAVID LECHUGA
            </p>

        </div>

    </div>

</div>



<!-- ============================================================
     MODAL AGENTE
============================================================ -->

<div
    id="modalAgente"
    class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 px-4"
>

    <div
        class="modal-panel w-full max-w-sm rounded-3xl bg-white p-6 shadow-2xl"
    >

        <div
            class="flex items-start justify-between mb-4"
        >

            <h3
                class="text-xl font-bold text-[#0A2342]"
            >
                Acciones
            </h3>


            <button
                type="button"
                onclick="cerrarModalAgente()"
                class="text-2xl leading-none text-gray-500 hover:text-gray-700"
            >
                ×
            </button>

        </div>


        <div
            class="mb-6 text-center"
        >

            <p
                id="modalAgenteNombre"
                class="text-2xl font-bold text-[#0A2342]"
            ></p>


            <div
                class="mt-3 space-y-2 text-sm text-slate-600"
            >

                <p
                    id="modalAgenteFecha"
                    class="flex items-center justify-center gap-2"
                >

                    📅

                    <span>
                        Fecha seleccionada
                    </span>

                </p>


                <p
                    id="modalAgenteTurno"
                    class="flex items-center justify-center gap-2"
                >

                    🔄

                    <span>
                        Turno
                    </span>

                </p>

            </div>

        </div>


        <div
            class="grid gap-3"
        >

            <button
                type="button"
                onclick="enviarWhatsAppAgente()"
                class="modal-button flex items-center justify-center gap-2 bg-green-600 px-4 py-3 font-semibold text-white shadow-sm hover:bg-green-700"
            >

                <span>
                    🟢
                </span>

                <span>
                    WhatsApp
                </span>

            </button>


            <button
                type="button"
                onclick="llamarAgente()"
                class="modal-button flex items-center justify-center gap-2 bg-blue-600 px-4 py-3 font-semibold text-white shadow-sm hover:bg-blue-700"
            >

                <span>
                    📞
                </span>

                <span>
                    Llamar
                </span>

            </button>


            <button
                type="button"
                onclick="cerrarModalAgente()"
                class="modal-button flex items-center justify-center gap-2 bg-slate-200 px-4 py-3 font-semibold text-slate-700 shadow-sm hover:bg-slate-300"
            >

                <span>
                    ↩️
                </span>

                <span>
                    Atrás
                </span>

            </button>

        </div>

    </div>

</div>



<!-- ============================================================
     JAVASCRIPT
============================================================ -->

<script defer src="js/config.js"></script>

<script defer src="js/utils.js"></script>

<script defer src="js/data.js"></script>

<script defer src="js/auth.js"></script>

<script defer src="js/modal.js"></script>

<script defer src="js/render.js"></script>

<script defer src="js/search.js"></script>

<script defer src="js/settings.js"></script>

<script defer src="js/app.js"></script>


</body>

</html>
